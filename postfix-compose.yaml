
services:

  ## POSTFIX
  ## =================

  dns:
    image: crazymax/unbound:latest
    container_name: dns
    user: "0:0"
    cap_add:
      - NET_BIND_SERVICE
    networks:
      internal:
        ipv4_address: 10.0.0.53
    restart: unless-stopped
    # Listener config is written at container start instead of bind-mounted
    # from ./unbound/conf.d/, so this has no host-file dependency at all.
    # Picked up via the image's own `include: /config/*.conf`, additively
    # alongside its default listener on 5053 - so the image's built-in
    # healthcheck (which probes 5053) is unaffected.
    # Recipe: https://github.com/springcomp/self-hosted-simplelogin/pull/46#issuecomment-3707216659
    #
    # module-config/identity/root-hints match what the previous
    # bind-mounted unbound/conf.d/00-unbound.conf set, to not weaken
    # anything the upstream maintainer deliberately configured:
    # - module-config trims the cachedb module the image loads by default
    #   (unused without a configured cache backend)
    # - root-hints pins the image's own dns-root-hints package file, which
    #   the image refreshes monthly via its own cron
    #   (/etc/periodic/monthly/dns-root-hints) - the compiled-in fallback
    #   Unbound would otherwise use only updates when the image itself does
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cat > /config/00-listen-port.conf <<'EOF'
        server:
          interface: 0.0.0.0@53
          log-queries: yes
          verbosity: 2
          module-config: "validator iterator"
          identity: "DNS"
          root-hints: "/usr/share/dns-root-hints/named.root"
        EOF
        unbound-anchor -a /var/run/unbound/root.key || true
        exec su -s /bin/sh unbound -c "sh /entrypoint.sh"

  postfix:
    image: private/postfix:latest
    build:
      context: ./postfix/
      dockerfile: Dockerfile
    container_name: postfix
    dns:
      - '10.0.0.53'
    networks:
      - internal
    env_file: .env
    ports:
      - '25:25'
    volumes:
      - certs:/certs:ro
      - postfix-runtime:/postfix-runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -w 3 127.0.0.1 25 </dev/null | grep -q '^220'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      dns:
        condition: service_healthy
      postgres:
        condition: service_healthy
      traefik-certificate-exporter:
        condition: service_healthy
    labels:
      - com.github.ravensorb.traefik-certificate-exporter.domain-restart=${SUBDOMAIN:-app}.${DOMAIN},${DOMAIN}

  traefik-certificate-exporter:
    image: ravensorb/traefik-certificate-exporter:latest
    container_name: cert-exporter
    environment:
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_FLAT=true
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_RESTARTCONTAINER=true
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_RUNATSTART=true
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_RESOLVERINPATHNAME=false
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_DOMAINS_INCLUDE=${DOMAIN},${SUBDOMAIN:-app}.${DOMAIN},*.${DOMAIN}
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_DOMAINS_EXCLUDE=exclude # see: https://github.com/ravensorb/traefik-certificate-exporter/issues/5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/data:ro
      - certs:/certs:rw
    healthcheck:
      test: ["CMD-SHELL", "[ -f \"/certs/${SUBDOMAIN:-app}.${DOMAIN}.fullchain.pem\" ] || [ -f \"/certs/${DOMAIN}.fullchain.pem\" ]"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5m
    depends_on:
      - app

volumes:
  certs:
  postfix-runtime:
  ## Uncomment the next lines, if traefik is running outside this project
  # traefik-acme:  # <-- do not change this identifier
  #   name: traefik-acme    # change (only) this to the name of traefik acme storage volume
  #   external: true
