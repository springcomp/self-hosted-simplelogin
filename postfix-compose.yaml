
services:

  dns:
    image: private/unbound:latest
    build:
      context: ./unbound/
      dockerfile: Dockerfile
    container_name: dns
    user: "0:0"
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /config
    networks:
      internal:
        ipv4_address: 10.0.0.53
    restart: unless-stopped
    # Listener/module/identity/root-hints/timeout settings live in
    # ./unbound/templates/ and are baked into the private/unbound image.
    # They are rendered into /config at container start by
    # unbound/docker-entrypoint.sh, so this still has no host-file
    # dependency - see unbound/Dockerfile and unbound/docker-entrypoint.sh
    # for the no-host-bind-mount rationale (matching the Postfix pattern
    # in ./postfix/).

  postfix:
    image: private/postfix:latest
    build:
      context: ./postfix/
      dockerfile: Dockerfile
    container_name: postfix
    dns:
      - '10.0.0.53'
    networks:
      - internal
    env_file: .env
    ports:
      # IPv4 only: the internal network is IPv4-only (see mynetworks)
      - '0.0.0.0:25:25'
    volumes:
      - certs:/certs:ro
      - postfix-runtime:/postfix-runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -w 3 127.0.0.1 25 </dev/null | grep -q '^220'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      dns:
        condition: service_healthy
      postgres:
        condition: service_healthy
      traefik-certificate-exporter:
        condition: service_healthy
    labels:
      - com.github.ravensorb.traefik-certificate-exporter.domain-restart=${SUBDOMAIN:-app}.${DOMAIN},${DOMAIN}

  traefik-certificate-exporter:
    image: ravensorb/traefik-certificate-exporter:0.3.1
    container_name: cert-exporter
    restart: unless-stopped
    environment:
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_FLAT=true
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_RESTARTCONTAINERX=true
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_RUNATSTART=true
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_RESOLVERINPATHNAME=false
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_DOMAINS_INCLUDE=${DOMAIN},${SUBDOMAIN:-app}.${DOMAIN}
    tmpfs:
      - /config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/data:ro
      - certs:/certs:rw
    healthcheck:
      test: ["CMD-SHELL", "[ -f \"/certs/${SUBDOMAIN:-app}.${DOMAIN}.fullchain.pem\" ] || [ -f \"/certs/${DOMAIN}.fullchain.pem\" ]"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5m
    depends_on:
      - app

volumes:
  certs:
  postfix-runtime:
  ## Uncomment the next lines, if traefik is running outside this project
  # traefik-acme:  # <-- do not change this identifier
  #   name: traefik-acme    # change (only) this to the name of traefik acme storage volume
  #   external: true
