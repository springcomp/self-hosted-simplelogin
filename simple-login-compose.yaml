x-sl-defaults: &sl-defaults
  image: simplelogin/$SL_IMAGE:$SL_VERSION
  env_file: .env
  # Paths inside the container - not meant to be end-user configurable
  # (we control the whole image/volume layout), so these are fixed here
  # rather than left for .env to set. Overrides any stale value a .env
  # might still carry from before this change.
  environment:
    DKIM_PRIVATE_KEY_PATH: /sl/dkim/dkim.key
    GNUPGHOME: /sl/pgp
    TEMP_DIR: /sl/tmp
    SAVE_UNSENT_DIR: /sl/unsent
  volumes:
    - sldata:/sl
    - upload:/code/static/upload
  networks:
    - internal

services:
  ## SIMPLE LOGIN
  ## ============

  postgres:
    image: postgres:17.7
    container_name: sl-db
    env_file: .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$$POSTGRES_PASSWORD pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432 || exit 1",
        ]
      interval: 10s
      retries: 3
      start_period: 1s
    networks:
      - internal
    volumes:
      - db:/var/lib/postgresql/data
    restart: unless-stopped

  migration:
    <<: *sl-defaults
    command: ["alembic", "upgrade", "head"]
    container_name: sl-migration
    depends_on:
      postgres:
        condition: service_healthy

  init:
    <<: *sl-defaults
    container_name: sl-init
    # Ensures the sldata volume has the directory structure the app needs,
    # and generates a DKIM key if none exists yet - runs on every start,
    # but only ever acts once (mkdir -p and the missing-key check are both
    # no-ops after the first successful run). This also covers the case
    # where migrate-volumes-compose.yaml (which does the same mkdir -p, to
    # have somewhere to copy pre-existing bind-mounted data into) has been
    # commented out after migration, or was never used at all.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        umask 077
        mkdir -p /sl/pgp /sl/dkim /sl/tmp /sl/unsent
        if [ ! -s "$$DKIM_PRIVATE_KEY_PATH" ]; then
          echo "[dkim-init] No key at $$DKIM_PRIVATE_KEY_PATH — generating 1024-bit RSA key..."
          openssl genrsa -out "$$DKIM_PRIVATE_KEY_PATH" 1024
        fi
        chmod 600 "$$DKIM_PRIVATE_KEY_PATH" 2>/dev/null || true
        exec python init_app.py
    depends_on:
      migration:
        condition: service_completed_successfully

  app:
    <<: *sl-defaults
    container_name: sl-app
    # Prints the DKIM public key on every start, for convenience when
    # setting up the DNS TXT record. No set -eu here: by the time this
    # container starts, `init` above has already guaranteed a valid key
    # exists, and the openssl pipe below wouldn't propagate a failure from
    # its first stage anyway (no pipefail in /bin/sh), so -e would only
    # look like protection without actually providing any.
    #
    # --timeout 45 (not the Dockerfile default of 15): a fix from an
    # earlier deployment that never made it back into the app repo.
    entrypoint:
      - /bin/sh
      - -c
      - |
        PUB="$(openssl rsa -in "$$DKIM_PRIVATE_KEY_PATH" -pubout -outform DER 2>/dev/null | openssl base64 -A)"
        echo "[dkim-init] DKIM public key (p=) — add this to your DNS TXT record:"
        echo "v=DKIM1; k=rsa; p=$$PUB"
        exec gunicorn wsgi:app -b 0.0.0.0:7777 -w 2 --timeout 45
    networks:
      - traefik
      - internal
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.services.sl-app.loadbalancer.server.port=7777
      - traefik.http.routers.sl-app.service=sl-app
      - traefik.http.routers.sl-app.middlewares=sts
      - traefik.http.routers.sl-app.rule=Host("${SUBDOMAIN:-app}.${DOMAIN:?DOMAIN_not_set}")
      - traefik.http.routers.sl-app.tls.certresolver=${LE_CHALLENGE:-tls}
      ## redirect http(s)://$DOMAIN -> https://$SUBDOMAIN.$DOMAIN
      - traefik.http.routers.${LE_CHALLENGE:-tls}.rule=Host("${DOMAIN}")
      - traefik.http.routers.${LE_CHALLENGE:-tls}.tls.certresolver=${LE_CHALLENGE:-tls}
      - traefik.http.routers.dns.tls.domains[0].main=${DOMAIN}
      - traefik.http.routers.dns.tls.domains[0].sans=*.${DOMAIN}
      - traefik.http.routers.${LE_CHALLENGE:-tls}.middlewares=sts,redir
      - traefik.http.middlewares.redir.redirectregex.regex=^https?://${DOMAIN}/?.*
      - traefik.http.middlewares.redir.redirectregex.replacement=https://${SUBDOMAIN:-app}.${DOMAIN}
      ## add STS Header for $DOMAIN and all subdomains
      - traefik.http.middlewares.sts.headers.stsSeconds=31536000
      - traefik.http.middlewares.sts.headers.sslRedirect=true
      - traefik.http.middlewares.sts.headers.forceSTSHeader=true
      - traefik.http.middlewares.sts.headers.stsIncludeSubdomains=true
      ## only set stsPreload=true, after registering your domain on hstspreload.org
      - traefik.http.middlewares.sts.headers.stsPreload=false
      ## static response for `mta-sts` subdomain
      - traefik.http.routers.mta-sts.rule=Host("mta-sts.${DOMAIN}") && PathPrefix("/.well-known/mta-sts.txt")
      - traefik.http.routers.mta-sts.service=noop@internal
      - traefik.http.routers.mta-sts.middlewares=mta-sts
      - traefik.http.middlewares.mta-sts.plugin.staticresponse.StatusCode=200
      - "traefik.http.middlewares.mta-sts.plugin.staticresponse.Body=version: STSv1\nmode: testing\nmx: ${SUBDOMAIN:-app}.${DOMAIN}\nmax_age: 86400"
      ## Note: The following parameters have to be set in traefik static config, to activate `staticresponse` plugin:
      # experimental.plugins.staticresponse.moduleName=github.com/jdel/staticresponse
      # experimental.plugins.staticresponse.version=v0.0.1

  email:
    <<: *sl-defaults
    command: ["python", "email_handler.py"]
    container_name: sl-email
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      postfix:
        condition: service_healthy

  job-runner:
    <<: *sl-defaults
    command: ["python", "job_runner.py"]
    container_name: sl-job-runner
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      email:
        condition: service_started

volumes:
  db:
  sldata:
  upload:
